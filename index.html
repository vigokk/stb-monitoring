<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>STB X1 Lite • Monitor & Control</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: radial-gradient(circle at top right, #1e293b 0%, #0b1120 70%);
      color: #f8fafc;
    }
    #loginOverlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center; padding: 20px;
      background: radial-gradient(circle at top right, #1e293b 0%, #0b1120 70%);
    }
    .login-card {
      width: 100%; max-width: 390px;
      background: rgba(30, 41, 59, 0.72); backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.28); border-radius: 24px;
      padding: 32px 28px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .login-card h1 {
      margin: 0 0 6px; font-size: 21px; font-weight: 700; text-align: center;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .login-card p { margin: 0 0 22px; font-size: 13px; color: #94a3b8; text-align: center; }
    .field { margin-bottom: 15px; }
    .field label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 6px; font-weight: 600; }
    .field input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(15, 23, 42, 0.85);
      color: #fff; font-size: 14px; outline: none;
    }
    .field input:focus { border-color: #38bdf8; }
    .btn-login {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #38bdf8;
      background: linear-gradient(135deg, #0284c7, #4f46e5);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3); margin-top: 6px;
    }
    .err { color: #f87171; font-size: 12px; text-align: center; margin-bottom: 12px; display: none; }
    #appFrame {
      position: fixed; inset: 0; width: 100%; height: 100%; border: none; display: none;
      background: #0b1120;
    }
  </style>
</head>
<body>
  <div id="loginOverlay">
    <form class="login-card" onsubmit="doAuth(event)">
      <h1>🔒 STB X1 Lite • Monitor & Control</h1>
      <p>Masukkan Username &amp; Password Anda</p>
      <div class="err" id="errMsg">Username atau Password salah!</div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="u" placeholder="admin" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="p" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-login">Masuk &rarr;</button>
    </form>
  </div>

  <iframe id="appFrame" allow="fullscreen; clipboard-read; clipboard-write"></iframe>

  <script>
    const TARGET_URL = "https://thank-avi-split-incurred.trycloudflare.com/?key=27042002";
    const TOKEN_KEY = "stb_gh_auth_v3_" + window.location.pathname;
    const SESSION_TIMEOUT_MS = 20 * 60 * 1000; // 20 menit

    function isSessionValid() {
      try {
        const raw = localStorage.getItem(TOKEN_KEY);
        if (!raw) return false;
        const data = JSON.parse(raw);
        if (data && data.exp && Date.now() < data.exp) {
          return true;
        }
      } catch (e) {}
      localStorage.removeItem(TOKEN_KEY);
      return false;
    }

    function lockApp() {
      localStorage.removeItem(TOKEN_KEY);
      const frame = document.getElementById("appFrame");
      frame.src = "about:blank";
      frame.style.display = "none";
      document.getElementById("loginOverlay").style.display = "flex";
    }

    function unlockApp() {
      document.getElementById("loginOverlay").style.display = "none";
      const frame = document.getElementById("appFrame");
      frame.style.display = "block";
      frame.src = TARGET_URL;
    }

    function doAuth(e) {
      e.preventDefault();
      const u = document.getElementById("u").value.trim();
      const p = document.getElementById("p").value;
      if (u === "admin" && p === "27042002") {
        localStorage.setItem(TOKEN_KEY, JSON.stringify({ exp: Date.now() + SESSION_TIMEOUT_MS }));
        unlockApp();
      } else {
        document.getElementById("errMsg").style.display = "block";
      }
    }

    window.addEventListener("message", function(ev) {
      if (ev.data === "stb_logout") {
        lockApp();
      } else if (ev.data && ev.data.navigate) {
        window.top.location.href = ev.data.navigate;
      }
    });

    if (isSessionValid()) {
      unlockApp();
    }

    setInterval(function() {
      if (document.getElementById("loginOverlay").style.display === "none" && !isSessionValid()) {
        lockApp();
      }
    }, 10000);
  </script>
</body>
</html>
